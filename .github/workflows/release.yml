name: Build Android APK & Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compile Gradle to APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Key & Environment
        run: |
          # Ensure .env exists for the secrets-gradle-plugin
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Decode the debug keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Distribution Artifacts
        run: |
          mkdir -p dist _site
          cp app/build/outputs/apk/debug/app-debug.apk dist/SuperOSINT.apk

          # Use web/ for the Pages site if it exists; otherwise publish a minimal page
          if [ -d web ]; then
            cp -r web/* _site/
          else
            echo '<!doctype html><meta charset="utf-8"><title>Super OSINT</title><h1>Super OSINT</h1><p><a href="SuperOSINT.apk">Download the APK</a></p>' > _site/index.html
          fi

          cp dist/SuperOSINT.apk _site/SuperOSINT.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperOSINT-apk
          path: dist/SuperOSINT.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: dist/SuperOSINT.apk
          tag_name: latest
          name: Super OSINT Latest APK Release
          body: |
            ### 🛡️ Super OSINT - Automatic Build

            - Commit: `${{ github.sha }}`
            - Direct Install APK: [SuperOSINT.apk](https://github.com/${{ github.repository }}/releases/download/latest/SuperOSINT.apk)
          draft: false
          prerelease: false
        continue-on-error: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy-pages:
    name: Deploy to GitHub Pages (.github.io)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
