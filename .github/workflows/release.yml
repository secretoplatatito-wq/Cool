name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for release (e.g., vE_0.0.1)'
        required: true
        default: 'vE_0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Secrets & Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Locate Built APK
        id: apk-location
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          TAG_NAME="${{ github.event.inputs.release_tag || github.ref_name }}"
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "gods-eye-observatory-${TAG_NAME}.apk"
          echo "apk_path=gods-eye-observatory-${TAG_NAME}.apk" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: "God's Eye Observatory Release ${{ steps.apk-location.outputs.tag_name }}"
          tag_name: ${{ steps.apk-location.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ steps.apk-location.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
